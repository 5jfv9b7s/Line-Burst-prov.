<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Burst</title>
  <link rel="stylesheet" href="LinkBurst_style.css">
</head>
<body>
  <main class="game-shell">
    <header><h1>Link Burst</h1><p class="subtitle">つなげて、ひっくり返して、バースト。</p></header>
    <section id="home_screen" class="home-screen" aria-labelledby="home-title">
      <div class="home-card">
        <p class="eyebrow">LINK - FLIP - BURST</p>
        <h2 id="home-title">Link Burst</h2>
        <p>4つ以上の石をつなげてバーストさせよう。</p>
        <div class="home-settings">
          <label>対戦<select id="home_mode"><option value="local">ふたりで対戦</option><option value="cpu">CPU対戦（あなたは黒）</option></select></label>
          <label id="home_cpu_setting">CPU難易度<select id="home_difficulty"><option value="easy">初級</option><option value="normal" selected>中級</option><option value="hard">上級</option></select></label>
          <label>持ち時間<select id="home_time_limit"><option value="none">なし</option><optgroup label="1手制限"><option value="turn-30">1手 30秒</option><option value="turn-60">1手 60秒</option></optgroup><optgroup label="チェス時計（持ち時間 + 着手加算）"><option value="chess-180-2">3分 + 2秒</option><option value="chess-300-3">5分 + 3秒</option><option value="chess-600-5">10分 + 5秒</option></optgroup></select></label>
          <label>スコア方式<select id="home_score_mode"><option value="stones">石の枚数</option><option value="bursts">バースト数</option><option value="combined">混同（石の枚数 + バースト数 × 10）</option></select></label>
        </div>
        <button id="start_button" class="start-button" type="button">ゲームスタート</button>
      </div>
    </section>
    <section id="game_screen" class="game-screen" aria-label="ゲーム画面" hidden>
      <div class="game-panel">
        <input id="game_mode" type="hidden" value="local">
        <input id="difficulty" type="hidden" value="normal">
        <input id="time_limit" type="hidden" value="none">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="timer" class="timer" aria-live="polite"></div>
        <div id="score_board" class="score-board"><div id="black_score" class="score black-score"></div><div id="white_score" class="score white-score"></div></div>
        <div id="board" aria-label="Link Burstの盤面"></div>
        <div class="action-buttons"><button id="undo_button" type="button">1手戻す</button><button id="restart_button" type="button">新しい対局</button><button id="home_button" type="button">ホームへ</button></div>
      </div>
      <section class="history">
        <h2>対局履歴</h2>
        <ol id="history_list"></ol>
      </section>
      <section class="rules">
        <h2>遊び方</h2>
        <ol>
          <li>基本ルールはオセロと同じです。相手の石をはさめる場所に置きます。</li>
          <li>同じ色の石が縦・横・斜めに4つ以上並ぶと、中間の石がバーストして消えます。</li>
          <li>中央の4マスの石は固定石です。</li>
          <li>両者が置けなくなったとき、開始時に選んだスコア方式で得点が高い側の勝ちです。チェス時計では、時間切れになった時点で負けです。</li>
        </ol>
      </section>
    </section>
  </main>
  <script src="LinkBurst_script.js"></script>
</body>
</html>
