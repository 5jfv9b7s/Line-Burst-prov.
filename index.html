<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Burst</title>
  <link rel="stylesheet" href="LinkBurst_style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Link Burst</h1>
      <p class="subtitle">つなげて、はじける、新しいオセロ。</p>
    </header>

    <section class="game-panel" aria-label="ゲーム画面">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="score_board" class="score-board" aria-label="現在の得点">
        <div id="black_score" class="score black-score"></div>
        <div id="white_score" class="score white-score"></div>
      </div>
      <div id="board" aria-label="Link Burst の盤面"></div>
      <button id="restart_button" type="button">新しい対局</button>
    </section>

    <section class="rules" aria-labelledby="rules-title">
      <h2 id="rules-title">遊び方</h2>
      <ol>
        <li>基本ルールはオセロと同じです。相手の石をはさめる場所に置きます。</li>
        <li>同じ色の石が縦・横・斜めに4個以上連なると、両端を残して間の石がバーストして消えます。</li>
        <li>中央の4マスの石は固定石です。バーストしても消えません。</li>
        <li>置ける場所がなければパスです。両者が置けなくなった時点で、盤上の石が多い側の勝ちです。</li>
      </ol>
    </section>
  </main>
  <script src="LinkBurst_script.js"></script>
</body>
</html>
